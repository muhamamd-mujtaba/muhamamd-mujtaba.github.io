<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">From medical background to computer engineering</title>
  <desc id="desc">A student desk scene showing medical study notes changing into programming and engineering work.</desc>
  <defs>
